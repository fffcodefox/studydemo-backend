spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 开发库：120.48.43.201:3306 / study_db
    # ⚠️ 本机连远程命中的是 "root@%" 这个账号（不是 root@localhost），两者口令不同：
    #     root@localhost → Aa@123          （只有服务器本机 socket / 宝塔面板用得到）
    #     root@%         → 下面这串 28 位随机口令（本机连远程走的是它）
    #   所以这里必须用 root@% 的口令，否则报 Access denied。
    #   2026-09-15 服务器安全加固时轮换，完整凭据见服务器 /root/credentials-20260915.txt
    # 注意：characterEncoding 必须填 Java 字符集名 UTF-8（不是 utf8mb4），
    # Connector/J 8 会自动与服务端协商为 utf8mb4；写成 utf8mb4 会直接启动失败。
    url: jdbc:mysql://120.48.43.201:3306/study_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: mMq8zhwTCwE9JnqCoIzAFlb7VAbp
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # dev 环境自动建表（幂等），建表失败不阻断启动
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql
  redis:
    # 开发 Redis：120.48.43.201:6379，db 0
    # ⚠️ 2026-09-12 该 Redis 曾被未授权入侵植入挖矿，已强制设置密码(dp 见 redis 入侵处置记录)
    host: 120.48.43.201
    port: 6379
    database: 0
    password: 200721377e56c52a563c928f679574d7
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.studydemo.server.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  cors:
    # 允许访问接口的前端来源，多个用逗号分隔。
    # 端口要和前端 .env.development 的 DEV_SERVER_PORT 一致（默认 5173）。
    # 前端走 Vite 代理时用不到跨域，这里是「前端直连后端」时的兜底。
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
