spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产库：服务器上的 studydemo-backend 由 systemd 用命令行参数覆盖本文件，
    # 实际生效的是 --spring.datasource.url=jdbc:mysql://127.0.0.1:3306/study_db
    #              --spring.datasource.username=study_app
    # （见 /etc/systemd/system/studydemo-backend.service），并非这里的 root。
    # ⚠️ 生产环境请替换为内网地址，并改用专有权限的数据库账号，禁止 root 直连。
    # 下面这行的口令是 "root@%" 的（从服务器外部连远程才命中的那个账号）；
    # 只在「本机跑 prod profile 连远程库」时用到，2026-09-15 安全加固时轮换。
    url: jdbc:mysql://120.48.43.201:3306/study_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: mMq8zhwTCwE9JnqCoIzAFlb7VAbp
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 10
      maximum-pool-size: 30
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # 生产环境不自动执行 schema
  sql:
    init:
      mode: never
  redis:
    # ⚠️ 2026-09-12 Redis 未授权入侵后已强制加密码，连接必须带密码
    host: 120.48.43.201
    port: 6379
    database: 0
    password: 200721377e56c52a563c928f679574d7
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 16
        min-idle: 4
        max-wait: 3000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.studydemo.server.domain
  configuration:
    map-underscore-to-camel-case: true
    # 生产关闭 SQL 全量日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  cors:
    # 生产前端域名，多个用逗号分隔。
    # 推荐做法是让 Nginx 把 /api 反代到本服务（前端页面与接口同源），
    # 那样跨域根本不会发生，这里只填真实域名即可。
    # ⚠️ 上线前把下面的示例域名换成你自己的。
    allowed-origins: https://your-domain.com
