spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 开发库：120.48.43.201:3306 / study_db / root / Aa@123
    # 注意：characterEncoding 必须填 Java 字符集名 UTF-8（不是 utf8mb4），
    # Connector/J 8 会自动与服务端协商为 utf8mb4；写成 utf8mb4 会直接启动失败。
    url: jdbc:mysql://120.48.43.201:3306/study_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Aa@123
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # dev 环境自动建表（幂等），建表失败不阻断启动
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql
  redis:
    # 开发 Redis：120.48.43.201:6379，db 0，无密码
    host: 120.48.43.201
    port: 6379
    database: 0
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.studydemo.server.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
