spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产库：连接信息与 dev 相同（你只提供了一套地址）。
    # ⚠️ 生产环境请替换为内网地址，并改用专有权限的数据库账号，禁止 root 直连。
    url: jdbc:mysql://120.48.43.201:3306/study_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Aa@123
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 10
      maximum-pool-size: 30
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # 生产环境不自动执行 schema
  sql:
    init:
      mode: never
  redis:
    host: 120.48.43.201
    port: 6379
    database: 0
    password:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 16
        min-idle: 4
        max-wait: 3000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.studydemo.server.domain
  configuration:
    map-underscore-to-camel-case: true
    # 生产关闭 SQL 全量日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
