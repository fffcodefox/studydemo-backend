spring:
  application:
    name: studydemo-server
  profiles:
    # 默认激活 dev 环境；生产用 --spring.profiles.active=prod 启动
    active: dev
  jackson:
    # P3C 规约：日期格式必须用小写 yyyy，禁止使用大写的 YYYY
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

server:
  # 服务端口。默认 8080，可用环境变量或启动参数覆盖：
  #   环境变量：SERVER_PORT=9090（Windows 用 set SERVER_PORT=9090）
  #   启动参数：java -jar target/studydemo-server-1.0.0.jar --server.port=9090
  # ⚠️ 改了端口，前端 .env.development 里的 DEV_PROXY_TARGET 要跟着一起改。
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    com.studydemo: debug
    root: info
